<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Little Loom is a premium baby and kids clothing store offering stylish outfits, school uniforms, seasonal collections, gift sets, and custom order solutions with comfort and quality.">
    <meta name="keywords"
        content="Little Loom, Baby Clothing, Kids Fashion, School Uniforms, Gift Sets, Children's Clothing, Custom Orders">
    <meta name="author" content="Little Loom">

    <!-- Title -->
    <title>Little Loom</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <section class="custom-order-page">

        <div class="container">

            <!--=====================================
                    Header
        ======================================-->

            <header class="custom-header">

                <a href="index.html" class="custom-logo">

                    <img src="images/logo.png" alt="Little Loom">

                </a>

                <!-- Use the same HTML/classes as your website header -->

                <div class="header-actions">

                    <button class="dark-mode-toggle" id="themeToggle">

                        <i class="fa-solid fa-moon"></i>

                    </button>

                    <button class="rtl-toggle" id="rtlToggle">

                        <i class="fa-solid fa-globe"></i>

                    </button>

                </div>

            </header>

            <!--=====================================
                    Form Card
        ======================================-->

            <div class="custom-order-card">

                <span class="section-subtitle">

                    Personalized Clothing

                </span>

                <h1>

                    Custom Order Request

                </h1>

                <p>

                    Looking for something unique? Share your requirements and we'll create the perfect outfit for your
                    little one.

                </p>

                <form>

                    <div class="custom-order-form-grid">

                        <div class="custom-order-form-group">

                            <label>First Name</label>

                            <input type="text" placeholder="Enter first name">

                        </div>

                        <div class="custom-order-form-group">

                            <label>Last Name</label>

                            <input type="text" placeholder="Enter last name">

                        </div>

                        <div class="custom-order-form-group">

                            <label>Email Address</label>

                            <input type="email" placeholder="Enter email">

                        </div>

                        <div class="custom-order-form-group">

                            <label>Phone Number</label>

                            <input type="tel" placeholder="Enter phone number">

                        </div>

                        <div class="custom-order-form-group">

                            <label>Category</label>

                            <select>

                                <option>Select Category</option>

                                <option>Baby Clothing</option>

                                <option>Kids Clothing</option>

                                <option>School Uniform</option>

                                <option>Gift Set</option>

                            </select>

                        </div>

                        <div class="custom-order-form-group">

                            <label>Quantity</label>

                            <input type="number" placeholder="Quantity">

                        </div>

                        <div class="custom-order-form-group">

                            <label>Preferred Size</label>

                            <select>

                                <option>Select Size</option>

                                <option>0-6 Months</option>

                                <option>6-12 Months</option>

                                <option>1-2 Years</option>

                                <option>3-4 Years</option>

                                <option>5-6 Years</option>

                            </select>

                        </div>

                        <div class="custom-order-form-group">

                            <label>Preferred Color</label>

                            <input type="text" placeholder="Eg. Sage Green">

                        </div>

                    </div>

                    <div class="custom-order-form-group">

                        <label>Preferred Delivery Date</label>

                        <input type="date">

                    </div>

                    <div class="custom-order-form-group">

                        <label>Upload Reference Image</label>

                        <input type="file">

                    </div>

                    <div class="custom-order-form-group">

                        <label>Additional Requirements</label>

                        <textarea rows="6" placeholder="Tell us your customization requirements..."></textarea>

                    </div>

                    <button class="primary-btn">

                        Submit Request

                    </button>

                </form>

            </div>

        </div>

    </section>

    <script src="js/main.js"></script>
</body>

</html>
